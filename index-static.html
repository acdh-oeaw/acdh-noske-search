<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/style.css" rel="stylesheet" />
    <title>NoSke Search Interface</title>
  </head>
  <body>
    <div id="noske-search"></div>
    <div id="hitsbox-test"></div>
    <div class="flex self-center">
      <div id="noske-pagination-test"></div>
      <div id="noske-stats"></div>
    </div>
    <script type="module">
      import { NoskeSearch } from "./dist/index.js";
      const search = new NoskeSearch({
        container: "noske-search",
        autocomplete: true,
        wordlistattr: [
          "word",
          "lemma",
          "pos",
          "id",
          "placeName",
          "persName",
          "pbId",
        ],
      });

      search.minQueryLength = 2;

      search.search({
        debug: true,
        client: {
          base: "https://abacus-noske.acdh-dev.oeaw.ac.at",
          corpname: "abacus",
          attrs: "word,lemma,pos,id,placeName,persName,pbId",
          structs: "doc",
          refs: "doc.id,doc.title",
        },
        hits: {
          id: "hitsbox-test",
          css: {
            div: "grid grid-cols-5 gap-4",
          },
        },
        pagination: {
          id: "noske-pagination-test",
        },
        searchInput: {
          id: "noske-input",
          placeholder:
            "Suche nach Wörter, Phrase oder CQL-Query (Regex erlaubt)",
          button: "Suchen",
          css: {
            div: "p-2",
            input: "p-2 border border-gray-500",
            select: "p-2 border border-gray-500",
            button: "p-2 border border-gray-500",
          },
        },
        config: {
          customUrl:
            "https://wiener-diarium.github.io/curved-conjunction/edition",
          urlparam: "&img=on",
        },
        stats: {
          id: "noske-stats",
        },
        autocompleteOptions: {
          id: "noske-autocomplete",
          css: {
            div: "bg-white border border-gray-300 absolute ml-10 mt-10 text-left min-w-[250px] min-h-[50px]",
            ul: "p-0",
            li: "p-2 cursor-pointer",
            loader:
              "m-2 border-4 border-gray-300 border-t-4 border-t-black rounded-full relative text-center w-[40px] h-[40px]",
          },
        },
      });
    </script>
  </body>
</html>
